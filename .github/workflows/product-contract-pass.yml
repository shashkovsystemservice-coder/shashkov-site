name: Product contract pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-contract-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-product:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add diagnostic product terms
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '<li><strong>Чтобы начать:</strong> достаточно описать ситуацию и прислать то, что уже есть. Полный пакет данных заранее не нужен.</li>'
          if marker not in s:
              raise SystemExit('Homepage start marker not found')
          s = s.replace(marker, '<li><strong>Срок:</strong> до 3 рабочих дней.</li>\n              <li><strong>Формат:</strong> одна встреча + самостоятельный анализ с моей стороны.</li>\n              ' + marker, 1)
          cost_anchor = '<li><strong>Граница:</strong> разбор имеет самостоятельную ценность; большой проект не обязателен.</li>'
          if cost_anchor not in s:
              raise SystemExit('Homepage boundary marker not found')
          s = s.replace(cost_anchor, '<li><strong>Стоимость:</strong> сообщаю до начала работы после короткого описания ситуации.</li>\n              ' + cost_anchor, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/work/page.tsx')
          s = p.read_text(encoding='utf-8')
          start = '<p><strong>Что нужно для старта.</strong> Достаточно описать ситуацию и прислать то, что уже есть. Полный пакет данных и готовое ТЗ заранее не нужны.</p>'
          if start not in s:
              raise SystemExit('Work start marker not found')
          s = s.replace(start, start + '\n          <p><strong>Формат.</strong> Одна встреча, затем самостоятельный анализ с моей стороны.</p>\n          <p><strong>Срок.</strong> До 3 рабочих дней.</p>', 1)
          boundary = '<p><strong>Где заканчивается.</strong> Разбор имеет самостоятельную ценность. Если для решения достаточно одного шага, полноценный стратегический проект не нужен.</p>'
          if boundary not in s:
              raise SystemExit('Work boundary marker not found')
          s = s.replace(boundary, '<p><strong>Стоимость.</strong> Сообщаю до начала работы после короткого описания ситуации. Сначала скажу, достаточно ли вообще диагностического разбора.</p>\n          ' + boundary, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/work/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Зафиксировать формат диагностического разбора'
          git push
